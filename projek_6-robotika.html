    <style>
      :root {
        --bg-dark: #0f0f1a;
        --text-light: #ffffff;
        --text-muted: #a0a0c0;
        --accent: #007bff;
        --gray-light: #f8f9fa;
      }
      body {
        font-family: "Inter", sans-serif;
        background: #fff;
        color: #333;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: 800;
      }

      /* Navbar */
      .navbar {
        transition: all 0.4s ease;
        background: transparent;
        padding: 1.5rem 0;
      }
      .navbar.scrolled {
        background: rgba(15, 15, 26, 0.95);
        backdrop-filter: blur(12px);
        padding: 1rem 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .navbar .nav-link {
        color: white !important;
        font-weight: 500;
        margin: 0 15px;
        position: relative;
      }
      .navbar .nav-link::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -6px;
        left: 50%;
        background: var(--accent);
        transition: all 0.3s;
      }
      .navbar .nav-link:hover::after {
        width: 100%;
        left: 0;
      }

      /* Hero */
      #home {
        height: 100vh;
        min-height: 600px;
        background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        overflow: hidden;
      }
      #home::before {
        content: "";
        position: absolute;
        inset: 0;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%230f0f1a"/><rect x="0" y="0" width="50" height="50" fill="%23151525"/><rect x="50" y="50" width="50" height="50" fill="%23151525"/></svg>')
          repeat;
        opacity: 0.4;
        animation: noise 10s steps(10) infinite;
      }
      @keyframes noise {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(10px, 10px);
        }
      }
      .hero-text h1 {
        font-size: 5rem;
        font-weight: 900;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .hero-text p {
        font-size: 1.6rem;
        font-weight: 300;
        opacity: 0.9;
      }
      .social-icons a {
        color: white;
        font-size: 1.8rem;
        margin: 0 20px;
        transition: all 0.3s;
      }
      .social-icons a:hover {
        color: var(--accent);
        transform: translateY(-5px);
      }

      section {
        padding: 100px 0;
      }
      .section-title {
        font-size: 3rem;
        text-align: center;
        margin-bottom: 60px;
        position: relative;
      }
      .section-title::after {
        content: "";
        width: 80px;
        height: 4px;
        background: var(--accent);
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
      }

      /* About */
      #about {
        background: var(--gray-light);
      }
      .about-img {
        border-radius: 50%;
        width: 300px;
        height: 300px;
        object-fit: cover;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      }

      /* Work Cards */
      .work-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        transition: all 0.4s ease;
        cursor: pointer;
      }
      .work-card:hover {
        transform: translateY(-15px) scale(1.02);
        box-shadow: 0 25px 50px rgba(0, 123, 255, 0.2);
        border: 1px solid var(--accent);
      }
      .work-card img {
        filter: grayscale(30%);
        transition: all 0.4s;
      }
      .work-card:hover img {
        filter: grayscale(0%);
        transform: scale(1.05);
      }

      /* GALLERY — SEMUA FOTO UKURAN SAMA (KOTAK PERSEGI) */
      .gallery-img {
        aspect-ratio: 1 / 1; /* Kotak persegi sempurna */
        overflow: hidden;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        transition: all 0.4s ease;
        filter: grayscale(80%);
        background: #111;
      }
      .gallery-img img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Crop rapi ke tengah */
        object-position: center;
        transition: all 0.4s ease;
      }
      .gallery-img:hover {
        filter: grayscale(0%);
        transform: scale(1.05);
      }
      .gallery-img:hover img {
        transform: scale(1.1);
      }

      /* Footer */
      #contact {
        background: var(--bg-dark);
        color: white;
        text-align: center;
        padding: 100px 0;
      }
      #contact .profile-small {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 4px solid var(--accent);
        object-fit: cover;
      }

      /* Fade-in Animation */
      .fade-in {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s ease-out;
      }
      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }

/* Pembungkus Thumbnail Video */
  .video-thumbnail-container {
    position: relative !important;
    display: inline-block;
    width: 100%;
    cursor: pointer;
    overflow: hidden;
    border-radius: 12px;
  }

  .video-thumbnail-container img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.3s ease;
  }

  /* Styling Tombol Play Merah di Tengah Gambar */
  .video-play-icon {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 60px;
    height: 60px;
    background-color: #ff0000;
    border-radius: 50%;
    display: flex !important;
    align-items: center;
    justify-content: center;
    z-index: 10 !important;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    transition: all 0.3s ease;
  }

  /* Segitiga Putih Tombol Play */
  .play-triangle {
    width: 0;
    height: 0;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 16px solid #ffffff;
    margin-left: 4px;
  }

  /* Efek Hover saat Kursor Diatas Gambar */
  .video-thumbnail-container:hover img {
    transform: scale(1.05);
  }

  .video-thumbnail-container:hover .video-play-icon {
    transform: translate(-50%, -50%) scale(1.15) !important;
    background-color: #cc0000;
  }

  

    </style>

<!-- 1. THUMBNAIL TRIGGER (Ubah link YouTube di fungsi showVideo) -->
<div class="col-lg-3 col-md-4 col-6 mb-4">
  <div 
    class="video-thumbnail-container" 
    data-bs-toggle="modal" 
    data-bs-target="#videoModal" 
    onclick="showVideo('https://www.youtube.com/embed/bU7o3MXHnSQ?autoplay=1')"
  >
    <div class="col fade-in">
      <div class="gallery-img">
        <img
          src="images/gallery/gl-pro-6/uns-robot1.jpeg" 
          alt="Demo Project Video"
          loading="lazy"
        />
        <div class="video-play-icon">
          <div class="play-triangle"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 2. BOOTSTRAP MODAL CONTAINER (Ganti tag <video> dengan <iframe>) -->
<div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-dark">
      <div class="modal-header border-0">
        <button 
          type="button" 
          class="btn-close btn-close-white" 
          data-bs-dismiss="modal" 
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body p-0 ratio ratio-16x9">
        <iframe 
          id="modalVideoPlayer" 
          src="" 
          title="YouTube video player" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>
</div>

<!-- 3. JAVASCRIPT KONTROL PLAYER (Disesuaikan untuk iframe) -->
<script>
  function showVideo(embedUrl) {
    const iframe = document.getElementById('modalVideoPlayer');
    iframe.src = embedUrl;
  }

  const videoModal = document.getElementById('videoModal');
  if (videoModal) {
    videoModal.addEventListener('hidden.bs.modal', function () {
      const iframe = document.getElementById('modalVideoPlayer');
      iframe.src = ''; // Menghentikan suara/video saat modal ditutup
    });
  }
</script>

    <!-- Bootstrap JS + Animasi -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Navbar scroll
      window.addEventListener("scroll", () => {
        document
          .querySelector(".navbar")
          .classList.toggle("scrolled", window.scrollY > 100);
      });

      // Fade-in on scroll
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) entry.target.classList.add("visible");
          });
        },
        { threshold: 0.1 },
      );
      document
        .querySelectorAll(".fade-in")
        .forEach((el) => observer.observe(el));

      // Lightbox
      function showImg(src) {
        document.getElementById("modalImg").src = src;
      }
    </script>
